<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RED EYE</title>
    <style>
        /* استایل‌های اختصاصی برای هماهنگی با پروژه Red Eye */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a; /* مشکی عمیق */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .login-container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); /* سایه قرمز ملایم */
            border: 1px solid #333;
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #ff0000; /* رنگ قرمز پروژه شما */
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #222;
            color: #fff;
            box-sizing: border-box; /* برای جلوگیری از بیرون زدن اینپوت */
            outline: none;
        }

        input:focus {
            border-color: #ff0000; /* تغییر رنگ حاشیه هنگام فوکوس */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #cc0000;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>RED EYE LOGIN</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">نام کاربری</label>
            <input type="text" id="username" name="username" placeholder="Enter Username" required>
        </div>
        <div class="input-group">
            <label for="password">رمز عبور</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>
        </div>
        <button type="submit">ورود به سیستم</button>
    </form>
    <div class="footer">
        &copy; 2026 RED EYE Project
    </div>
</div>

<script>
    // اسکریپت ساده برای مدیریت فرم و چک کردن اعتبار (جهت تست)
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // اطلاعاتی که درخواست کردی
        const correctUser = "333opDonn.mmod"; // توجه: اگر یوزر و پسورد یکی هست، اینجا هر دو را چک کن
        const correctPass = "333opDonn.mmod";

        if (user === correctUser && pass === correctPass) {
            alert("Login Successful! Access Granted.");
            // اینجا می‌تونی کاربر رو به صفحه دیگه‌ای هدایت کنی
        } else {
            alert("Access Denied! Invalid Credentials.");
        }
    });
</script>

</body>
</html>
